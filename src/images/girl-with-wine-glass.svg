<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="500" fill="#f8f8f8"/>
  
  <!-- Hair -->
  <path d="M300,120 C240,120 230,200 230,240 C230,280 240,320 250,370 C260,420 280,450 300,450 C320,450 340,420 350,370 C360,320 370,280 370,240 C370,200 360,120 300,120" fill="#6b4423"/>
  
  <!-- Neck -->
  <path d="M290,220 C290,240 310,240 310,220 L310,250 C310,270 290,270 290,250 Z" fill="#ffe0bd"/>
  
  <!-- Face -->
  <ellipse cx="300" cy="170" rx="50" ry="60" fill="#ffe0bd"/>
  
  <!-- Eyes -->
  <ellipse cx="280" cy="160" rx="5" ry="3" fill="#3d3d3d"/>
  <ellipse cx="320" cy="160" rx="5" ry="3" fill="#3d3d3d"/>
  
  <!-- Eyebrows -->
  <path d="M275,150 C280,145 290,145 295,150" stroke="#6b4423" stroke-width="2" fill="none"/>
  <path d="M305,150 C310,145 320,145 325,150" stroke="#6b4423" stroke-width="2" fill="none"/>
  
  <!-- Mouth -->
  <path d="M290,190 C300,197 310,190 310,190" stroke="#d35f5f" stroke-width="2" fill="none"/>
  
  <!-- Dress -->
  <path d="M250,250 C250,300 260,400 300,450 C340,400 350,300 350,250 L350,320 C350,420 250,420 250,320 Z" fill="#e91e63"/>
  
  <!-- Left Arm (holding wine glass) -->
  <path d="M250,270 C230,280 210,300 200,330 C190,360 180,400 210,410" stroke="#ffe0bd" stroke-width="25" fill="none" stroke-linecap="round"/>
  
  <!-- Right Arm -->
  <path d="M350,270 C370,280 385,330 380,370" stroke="#ffe0bd" stroke-width="25" fill="none" stroke-linecap="round"/>
  
  <!-- Wine Glass -->
  <path d="M210,410 L210,360 C210,350 195,350 195,360 L195,340 C195,320 225,320 225,340 L225,360 C225,350 210,350 210,360 L210,410" fill="none" stroke="#d3d3d3" stroke-width="2"/>
  <path d="M195,340 C195,320 225,320 225,340" fill="#8b0000" fill-opacity="0.7"/>
  
  <!-- Wine Glass Stem -->
  <line x1="210" y1="410" x2="210" y2="430" stroke="#d3d3d3" stroke-width="2"/>
  
  <!-- Wine Glass Base -->
  <ellipse cx="210" cy="430" rx="10" ry="3" fill="none" stroke="#d3d3d3" stroke-width="2"/>
</svg>